[project]
name = "pyrat-workspace"
version = "0.1.0"
description = "Workspace for the PyRat software"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyrat-game",
    "test-py>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["."]

[tool.uv]
package = true
preview-features = ["relocatable-envs-default"]
